<title>Almost There</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Reenie+Beanie&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap">
<style>
/* Layout: one full-bleed canvas, HUD layered on top. Single dark look by choice (it is a night-time game). */
:root{
  --bg:#060607; --ink:#d9d4c5; --dim:#7d786c; --line:#35322b; --warm:#c9a86a;
  --ui:'VT323','Courier New',monospace; --voice:'Cormorant Garamond',Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;background:var(--bg)}
#game canvas{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:crosshair}
.hud{position:fixed;pointer-events:none;font-family:var(--ui)}
#objective{top:calc(16px + env(safe-area-inset-top,0px));left:calc(20px + env(safe-area-inset-left,0px));font-size:22px;color:var(--dim);opacity:0;transition:opacity .9s;letter-spacing:.05em}
#objective.show{opacity:1}
#cross{left:50%;top:50%;width:3px;height:3px;margin:-1px 0 0 -1px;background:var(--ink);opacity:.3}
#prompt{left:50%;top:calc(50% + 26px);transform:translateX(-50%);font-size:24px;opacity:0;transition:opacity .2s;white-space:nowrap;text-shadow:0 0 6px #000}
#prompt.show{opacity:.92}
#prompt kbd{font-family:inherit;color:var(--warm);margin-right:.35em}
#subtitle{left:50%;bottom:calc(15% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(84vw,640px);text-align:center;opacity:0;transition:opacity 1.2s}
#subtitle.show{opacity:1}
#subtitle.voice{font-family:var(--voice);font-style:italic;font-size:clamp(22px,3vw,31px);color:#e9e3d3;text-shadow:0 0 14px #000,0 0 3px #000}
#subtitle.thought{font-family:var(--ui);font-size:27px;letter-spacing:.14em;color:#b3ad9c;text-shadow:0 0 8px #000,0 0 2px #000}
#subtitle.machine{font-family:var(--ui);font-size:25px;letter-spacing:.22em;color:var(--warm);text-shadow:0 0 8px #000}
#card{inset:0;display:grid;place-items:center;font-size:clamp(34px,6vw,62px);letter-spacing:.5em;text-indent:.5em;opacity:0;transition:opacity 1.6s}
#card.show{opacity:1}
#intrude{inset:0;overflow:hidden;z-index:3}
#blood{inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:0;z-index:2;transition:opacity 2.5s}
#blood.now{transition:none}
#intrude span{position:absolute;font-family:var(--ui);color:#ece6d6;white-space:nowrap;letter-spacing:.06em;text-shadow:3px 0 rgba(190,30,25,.75),-3px 0 rgba(40,150,190,.45),0 0 14px #000}
#hint{left:50%;bottom:calc(6% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:22px;color:var(--dim);opacity:0;transition:opacity .6s;white-space:nowrap}
#hint.show{opacity:1}
#choice{position:fixed;inset:0;display:grid;place-items:center;z-index:5}
#choice .cbox{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;margin-top:18vh;padding:0 16px}
#choice button{font-family:var(--voice);font-style:italic;font-size:29px;background:rgba(0,0,0,.35);color:var(--ink);border:1px solid var(--line);padding:.45em 1.5em;cursor:pointer}
#choice button:hover{border-color:var(--warm);color:#fff}
button:focus-visible{outline:1px solid var(--warm);outline-offset:4px}
#examine{position:fixed;inset:0;background:rgba(3,3,4,.88);display:grid;place-items:center;z-index:6;cursor:pointer}
#examine img{width:min(68vmin,460px);max-width:100%;image-rendering:pixelated;box-shadow:0 0 0 1px var(--line)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:10;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center;transition:opacity 1.2s}
#start{background:rgba(5,5,6,.66)}
#end{background:var(--bg)}
.screen h1{font-family:var(--ui);font-weight:400;font-size:clamp(46px,10vw,96px);letter-spacing:.34em;text-indent:.34em;margin:0;line-height:1;text-wrap:balance}
.small{font-family:var(--ui);font-size:20px;color:var(--dim);letter-spacing:.06em;line-height:1.35;margin:0;max-width:34ch}
.btn{font-family:var(--ui);font-size:26px;letter-spacing:.3em;text-indent:.3em;background:none;border:1px solid #3a372f;color:var(--ink);padding:.3em 1.4em;cursor:pointer}
.btn:hover{border-color:var(--warm);color:var(--warm)}
.fadeout{opacity:0;pointer-events:none}
.chapters{display:flex;flex-wrap:wrap;justify-content:center;max-width:620px;gap:4px 18px;align-items:center;font-family:var(--ui);font-size:18px;color:var(--dim);letter-spacing:.1em}
.chap{font:inherit;background:none;border:none;color:var(--dim);cursor:pointer;letter-spacing:.18em;padding:4px 2px;text-decoration:underline;text-underline-offset:5px}
.chap:hover{color:var(--warm)}
.chlabel{width:100%;text-align:center;letter-spacing:.3em;font-size:15px;opacity:.7}
#pause{background:rgba(5,5,6,.84);z-index:20}
.pmenu{display:flex;flex-direction:column;gap:16px;align-items:stretch;width:min(340px,100%)}
.prow{font-family:var(--ui);font-size:20px;color:var(--dim);display:flex;justify-content:space-between;align-items:center;gap:16px;letter-spacing:.18em}
.prow input{accent-color:var(--warm);width:58%}
#pauseBtn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);font-family:var(--ui);font-size:18px;z-index:6}
#use{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;
  border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);font-family:var(--ui);font-size:20px;letter-spacing:.1em;z-index:4}
#use.live{border-color:var(--warm);color:var(--warm)}
#joy{position:fixed;width:90px;height:90px;margin:-45px 0 0 -45px;border:1px solid var(--line);border-radius:50%;pointer-events:none;z-index:4}
#joy i{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:rgba(217,212,197,.18)}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
function showErr(m){let e=document.getElementById('errbox');if(!e){e=document.createElement('div');e.id='errbox';e.style.cssText='position:fixed;left:8px;bottom:8px;z-index:99;font:13px monospace;color:#e07a6a;background:rgba(0,0,0,.7);padding:4px 8px;max-width:90vw;pointer-events:none';document.body.appendChild(e);}e.textContent='error: '+m;}
addEventListener('error',ev=>showErr(ev.message+' @'+(ev.lineno||'?')));
addEventListener('unhandledrejection',ev=>showErr(String(ev.reason&&ev.reason.message||ev.reason)));
const isTouch=matchMedia('(pointer: coarse)').matches;
const SET={vol:1,sens:1,bright:1};try{Object.assign(SET,JSON.parse(localStorage.getItem('almostthere_settings')||'{}'));}catch(_){}
const MEM={loops:0,stopped:0};try{Object.assign(MEM,JSON.parse(localStorage.getItem('almostthere_mem')||'{}'));}catch(_){}
function saveMem(){try{localStorage.setItem('almostthere_mem',JSON.stringify(MEM));}catch(_){}}
let GLITCH=0;
function tallyText(n){let t='';for(let i=1;i<=n;i++){t+='|';if(i%5===0)t+='  ';}return t;}
function saveSet(){try{localStorage.setItem('almostthere_settings',JSON.stringify(SET));}catch(_){}}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PI=Math.PI;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R0=rng(7);const rand=(a,b)=>a+(b-a)*R0();

if(isTouch){$('#ctrlText').innerHTML='Left side to walk · right side to look · USE to interact<br>Headphones recommended.';}

/* ================= RENDERER ================= */
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});}
catch(e){$('#start').innerHTML='<h1>ALMOST THERE</h1><p class="small">This browser could not start WebGL, so the game cannot run here.</p>';return;}
renderer.setPixelRatio(1);
$('#game').appendChild(renderer.domElement);
const canvas=renderer.domElement;
const LOW_H=360;
const rt=new THREE.WebGLRenderTarget(320,LOW_H,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,depthBuffer:true});
rt.depthTexture=new THREE.DepthTexture(320,LOW_H);rt.depthTexture.type=THREE.UnsignedIntType;
const camera=new THREE.PerspectiveCamera(72,4/3,0.08,80);
camera.rotation.order='YXZ';

const postMat=new THREE.ShaderMaterial({
  uniforms:{uGlitch:{value:0},uRed:{value:0},uBright:{value:1},tD:{value:rt.texture},uRes:{value:new THREE.Vector2(320,240)},uBlink:{value:0},uFade:{value:1},uWhite:{value:0},uStatic:{value:0},uTime:{value:0}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader:`
  uniform sampler2D tD;uniform vec2 uRes;uniform float uBlink,uFade,uWhite,uStatic,uTime,uBright,uRed,uGlitch;varying vec2 vUv;
  float b2(vec2 a){a=floor(a);return fract(a.x/2.+a.y*a.y*.75);}
  float b4(vec2 a){return b2(.5*a)*.25+b2(a);}
  void main(){
    vec2 px=floor(vUv*uRes);
    float tk=floor(uTime*9.);float burst=uGlitch*step(.9,fract(sin(tk*91.7)*43758.5));
    float band=fract(uTime*.07)*uRes.y;float inb=step(abs(px.y-band),2.+uGlitch*9.);
    px.x+=floor(inb*uGlitch*7.+burst*(fract(sin(px.y*12.9+tk)*999.)-.5)*18.);
    float ca=uGlitch*1.5+burst*3.;
    vec3 c=vec3(texture2D(tD,(px+vec2(ca,0.)+.5)/uRes).r,texture2D(tD,(px+.5)/uRes).g,texture2D(tD,(px-vec2(ca,0.)+.5)/uRes).b);
    c*=1.-inb*uGlitch*.35;
    float n=fract(sin(dot(px+floor(uTime*20.)*vec2(13.1,7.7),vec2(12.9898,78.233)))*43758.5453);
    c=mix(c,vec3(n*.8),uStatic);c*=uBright;c=mix(c,vec3(c.r*.6+.32,c.g*.08,c.b*.06),uRed);
    vec2 q=vUv-.5; c*=1.08-dot(q,q)*.9;
    float d=(b4(px)-.5)/56.;
    c=floor((c+d)*63.+.5)/63.;
    float curve=abs(vUv.y-.5)*2.+q.x*q.x*.7;
    float th=1.25-uBlink*1.45;
    c*=1.-smoothstep(th,th+.1,curve);
    c=mix(c,vec3(0.),uFade);
    c=mix(c,vec3(.9,.89,.85),uWhite);
    gl_FragColor=vec4(c,1.);
  }`,depthTest:false,depthWrite:false});
const postScene=new THREE.Scene();
const postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),postMat));

/* PS1 material: per-vertex light, snapped vertices, affine UVs, fog */
const SH={
  uAmbient:{value:new THREE.Vector3(.1,.1,.1)},
  uLightPos:{value:[0,1,2,3].map(()=>new THREE.Vector3())},
  uLightCol:{value:[0,1,2,3].map(()=>new THREE.Vector3())},
  uLightRange:{value:[1,1,1,1]},
  uFogColor:{value:new THREE.Vector3()},uFogNear:{value:4},uFogFar:{value:20},
  uSnap:{value:new THREE.Vector2(160,120)}
};
const VS=`
uniform vec3 uLightPos[4];uniform vec3 uLightCol[4];uniform float uLightRange[4];
uniform vec3 uAmbient;uniform vec2 uSnap;uniform float uFogNear,uFogFar,uEmissive;
varying vec3 vLight;varying vec2 vUvA;varying float vW;varying float vFog;
void main(){
  vec4 wp=modelMatrix*vec4(position,1.);
  vec3 n=normalize(mat3(modelMatrix)*normal);
  vec3 L=uAmbient;
  for(int i=0;i<4;i++){
    vec3 d=uLightPos[i]-wp.xyz;float dist=length(d);
    float att=clamp(1.-dist/uLightRange[i],0.,1.);att*=att;
    float nd=max(dot(n,d/max(dist,.001)),0.);
    L+=uLightCol[i]*att*(.35+.65*nd);
  }
  vLight=min(L+vec3(uEmissive),vec3(1.6));
  vec4 mv=viewMatrix*wp;vec4 p=projectionMatrix*mv;
  if(p.w>2.5){vec2 s=uSnap*.5;p.xy=floor(p.xy/p.w*s+.5)/s*p.w;}
  gl_Position=p;
  vUvA=uv;vW=1.;
  vFog=smoothstep(uFogNear,uFogFar,length(mv.xyz));
}`;
const FS=`
uniform sampler2D map;uniform vec3 uColor;uniform vec3 uFogColor;
varying vec3 vLight;varying vec2 vUvA;varying float vW;varying float vFog;
void main(){
  vec4 t=texture2D(map,vUvA/vW);
  if(t.a<.5)discard;
  vec3 c=t.rgb*uColor*vLight;
  c=mix(c,uFogColor,vFog);
  gl_FragColor=vec4(c,1.);
}`;
const matCache=new Map();
let WHITE;
function mat(t,color=0xffffff,o={}){
  const key=(t?t.uuid:'w')+'|'+color+'|'+(o.em||0)+'|'+(o.side||0);
  if(!o.unique&&matCache.has(key))return matCache.get(key);
  const m=new THREE.ShaderMaterial({uniforms:Object.assign({},SH,{map:{value:t||WHITE},uColor:{value:new THREE.Color(color)},uEmissive:{value:o.em||0}}),
    vertexShader:VS,fragmentShader:FS,side:o.side===2?THREE.DoubleSide:THREE.FrontSide});
  if(!o.unique)matCache.set(key,m);
  return m;
}
function setLights(list,amb,fog,near,far){
  for(let i=0;i<4;i++){
    const l=list[i];
    if(l){SH.uLightPos.value[i].set(l[0],l[1],l[2]);SH.uLightCol.value[i].set(l[3],l[4],l[5]);SH.uLightRange.value[i]=l[6];}
    else{SH.uLightCol.value[i].set(0,0,0);SH.uLightRange.value[i]=1;}
  }
  if(amb)SH.uAmbient.value.set(amb[0],amb[1],amb[2]);
  if(fog)SH.uFogColor.value.set(fog[0],fog[1],fog[2]);
  if(near!=null)SH.uFogNear.value=near;
  if(far!=null)SH.uFogFar.value=far;
}

/* ================= TEXTURES ================= */
function tex(w,h,draw,repeat=true){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');g.imageSmoothingEnabled=false;draw(g,w,h);
  const t=new THREE.CanvasTexture(c);
  t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestMipmapLinearFilter;t.generateMipmaps=true;
  t.wrapS=t.wrapT=repeat?THREE.RepeatWrapping:THREE.ClampToEdgeWrapping;
  return t;
}
function speckle(g,w,h,amt,seed){const r=rng(seed);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const v=(r()-.5)*amt;g.fillStyle=v>0?`rgba(255,255,255,${v})`:`rgba(0,0,0,${-v})`;g.fillRect(x,y,1,1);}}
function base(g,w,h,c){g.fillStyle=c;g.fillRect(0,0,w,h);}
WHITE=tex(4,4,(g,w,h)=>base(g,w,h,'#fff'));
const TX={};
TX.asphalt=tex(64,64,(g,w,h)=>{base(g,w,h,'#2c2c2f');speckle(g,w,h,.28,1);const r=rng(2);for(let i=0;i<40;i++){g.fillStyle='rgba(150,150,150,.25)';g.fillRect(r()*w|0,r()*h|0,1,1);}g.fillStyle='rgba(0,0,0,.25)';g.fillRect(20,0,3,64);});
TX.grass=tex(32,32,(g,w,h)=>{base(g,w,h,'#1c2418');speckle(g,w,h,.35,3);});
TX.foliage=tex(32,32,(g,w,h)=>{base(g,w,h,'#18241a');speckle(g,w,h,.4,4);});
TX.concrete=tex(32,32,(g,w,h)=>{base(g,w,h,'#5c5953');speckle(g,w,h,.25,5);g.fillStyle='rgba(0,0,0,.2)';g.fillRect(0,0,32,1);g.fillRect(9,14,3,18);});

function makeVoidD(){VOIDD.uTime=VOIDU.uTime;VOIDD.uAmp=VOIDU.uAmp;VOIDD.uFade=FIGU.uFade;VOIDD.uDepth.value=rt.depthTexture;
  voidMatD=new THREE.ShaderMaterial({uniforms:VOIDD,side:THREE.FrontSide,
  vertexShader:`uniform float uTime,uAmp;varying vec3 vN;varying vec3 vV;
    void main(){vec3 p=position;vec4 w=modelMatrix*vec4(p,1.);
      float d=sin(w.x*47.+uTime*7.3)*sin(w.y*39.-uTime*5.1)*sin(w.z*43.+uTime*6.7)+.5*sin(w.y*91.+uTime*17.)*sin(w.x*83.-uTime*13.);

  fragmentShader:`uniform sampler2D uDepth;uniform vec2 uCanvas;uniform float uTime,uFade,uWhite;varying vec3 vN;varying vec3 vV;

    void main(){
      float sd=texture2D(uDepth,gl_FragCoord.xy/uCanvas).x;
      if(gl_FragCoord.z>sd+.00003)discard;
      float e=abs(dot(normalize(vN),normalize(-vV)));
      float n=h(floor(gl_FragCoord.xy*.5)+floor(uTime*20.)*vec2(3.1,1.7));
      float n2=h(floor(gl_FragCoord.xy*.125)+floor(uTime*6.)*vec2(1.3,2.9));
      if(e<.36&&mix(n,n2,.5)>smoothstep(.0,.36,e))discard;

function scaleUV(gm,fn){const uv=gm.attributes.uv,n=gm.attributes.normal;for(let i=0;i<uv.count;i++){const s=fn(Math.abs(n.getX(i)),Math.abs(n.getY(i)));uv.setXY(i,uv.getX(i)*s[0],uv.getY(i)*s[1]);}}
function box(w,h,d,t,color,o={}){
  const seg=o.seg||0.6;
  const gm=new THREE.BoxGeometry(w,h,d,Math.max(1,Math.ceil(w/seg)),Math.max(1,Math.ceil(h/seg)),Math.max(1,Math.ceil(d/seg)));
  if(!o.fit){const ts=o.ts||1;scaleUV(gm,(nx,ny)=>nx>.5?[d/ts,h/ts]:ny>.5?[w/ts,d/ts]:[w/ts,h/ts]);}
  const m=new THREE.Mesh(gm,mat(t,color,o));
  if(o.pos)m.position.set(o.pos[0],o.pos[1],o.pos[2]);
  if(o.rot)m.rotation.set(o.rot[0],o.rot[1],o.rot[2]);
  return m;
}
function plane(w,h,t,color,o={}){
  const seg=o.seg||0.6;
  const gm=new THREE.PlaneGeometry(w,h,Math.max(1,Math.ceil(w/seg)),Math.max(1,Math.ceil(h/seg)));
  if(!o.fit){const ts=o.ts||1;const uv=gm.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*w/ts,uv.getY(i)*h/ts);}
  const m=new THREE.Mesh(gm,mat(t,color,o));
  if(o.floor)m.rotation.x=-PI/2;
  if(o.ceil)m.rotation.x=PI/2;
  if(o.rotY!=null)m.rotation.y=o.rotY;
  if(o.pos)m.position.set(o.pos[0],o.pos[1],o.pos[2]);
  return m;
}
function cyl(rt_,rb,h,seg,t,color,o={}){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt_,rb,h,seg,1),mat(t,color,o));
  if(o.pos)m.position.set(o.pos[0],o.pos[1],o.pos[2]);
  if(o.rot)m.rotation.set(o.rot[0],o.rot[1],o.rot[2]);
  return m;
}

function whisper(dur,vol=.22,layers=3){if(!AU.C)return;const C=AU.C,t=C.currentTime;

    if(C.createStereoPanner){const p=C.createStereoPanner();p.pan.value=Math.random()*2-1;g.connect(p);p.connect(AU.muffle);}else g.connect(AU.muffle);
    let tt=t+L*.09;while(tt<t+dur){const sy=.07+Math.random()*.15;g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(vol*(.4+Math.random()*.6),tt+sy*.3);g.gain.linearRampToValueAtTime(0,tt+sy);bp.frequency.setValueAtTime(1400+Math.random()*2800,tt);tt+=sy+Math.random()*.07;}
    s.stop(t+dur+.3);}
}

  if(n>=2){const o=C.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(90,t+2.5);o.frequency.linearRampToValueAtTime(60,t+4.5);const b=F('bandpass',700,8),g=G(0);g.gain.setValueAtTime(0,t+2.5);g.gain.linearRampToValueAtTime(.06,t+3);g.gain.linearRampToValueAtTime(0,t+4.6);chain(o,b,g,d);o.start(t+2.5);o.stop(t+4.7);}
  if(n>=3){for(const st of[3.2,4.6,6.0]){const o=C.createOscillator();o.type='square';o.frequency.value=62;const g=G(0);g.gain.setValueAtTime(0,t+st);g.gain.linearRampToValueAtTime(.05,t+st+.02);g.gain.setValueAtTime(.05,t+st+.4);g.gain.linearRampToValueAtTime(0,t+st+.42);const l=F('lowpass',300);chain(o,l,g,d);o.start(t+st);o.stop(t+st+.45);}}
  if(n>=4){const o=C.createOscillator();o.frequency.value=960;const g=G(0);g.gain.setValueAtTime(0,t+5);g.gain.linearRampToValueAtTime(.02,t+5.5);g.gain.linearRampToValueAtTime(0,t+D);o.connect(g);g.connect(d);o.start(t+5);o.stop(t+D);}
  await wait(D);}

function bloodSplat(){const c=$('#blood');const W=200,H=Math.max(100,Math.round(200*innerHeight/innerWidth));c.width=W;c.height=H;const g=c.getContext('2d');g.clearRect(0,0,W,H);
  const r=Math.random,drips=[];const red=a=>`rgba(${90+r()*60|0},${3+r()*8|0},${3+r()*6|0},${a})`;
  for(let i=0;i<11;i++){const edge=r()<.7;const x=edge?(r()<.5?r()*W*.28:W-r()*W*.28):W*.25+r()*W*.5,y=r()*H*.75,rr=4+r()*(edge?16:9);
    g.fillStyle=red(.96);g.beginPath();g.arc(x,y,rr,0,7);g.fill();
    for(let k=0;k<16;k++){const a=r()*7,d=rr+r()*rr*2.2;g.fillStyle=red(.9);g.beginPath();g.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,.6+r()*2.2,0,7);g.fill();}
    for(let k=0;k<3;k++)drips.push({x:x-rr*.7+r()*rr*1.4,y:y+rr*.3,w:1+(r()*2|0),len:0,max:10+r()*H*.5,sp:20+r()*55});}

const keys={};
const controls={move:false,look:false};
const joy={id:null,ox:0,oy:0,x:0,y:0};let lookTouch=null;
let stage=null;let examining=false;
function locked(){return document.pointerLockElement===canvas;}
function look(dx,dy,s){if(!controls.look||examining||paused)return;s*=SET.sens;stage.yaw-=dx*s;stage.pitch=clamp(stage.pitch-dy*s,stage.pMin,stage.pMax);if(stage.yMax)stage.yaw=clamp(stage.yaw,-stage.yMax,stage.yMax);}
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='Escape'){if(!e.repeat){if(examining)closeExamine();else if(!(paused&&performance.now()-pausedAt<350))setPause(!paused);}return;}
  if(paused)return;
  if(e.repeat)return;keys[e.code]=true;
  if(examining){closeExamine();return;}
  if(e.code==='KeyE'||e.code==='Enter')interact();
  if(e.code==='Space')stage&&stage.wake&&stage.wake();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
let dragging=false;
canvas.addEventListener('mousedown',e=>{
  if(isTouch)return;
  if(examining){closeExamine();return;}
  if(locked()){interact();return;}
  dragging=true;
  if(controls.look){try{const p=canvas.requestPointerLock();if(p&&p.catch)p.catch(()=>{});}catch(_){}}
});
addEventListener('mouseup',()=>{dragging=false;});
addEventListener('mousemove',e=>{if(locked())look(e.movementX,e.movementY,.0022);else if(dragging)look(e.movementX,e.movementY,.004);});
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(examining){closeExamine();return;}
  for(const t of e.changedTouches){
    if(t.clientX<innerWidth*.45&&joy.id===null){joy.id=t.identifier;joy.ox=t.clientX;joy.oy=t.clientY;joy.x=joy.y=0;const j=$('#joy');j.hidden=false;j.style.left=t.clientX+'px';j.style.top=t.clientY+'px';j.firstElementChild.style.transform='';}
    else if(lookTouch===null)lookTouch={id:t.identifier,x:t.clientX,y:t.clientY};
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joy.id){const dx=t.clientX-joy.ox,dy=t.clientY-joy.oy;const l=Math.hypot(dx,dy),m=Math.min(l,45);joy.x=l?dx/l*m/45:0;joy.y=l?dy/l*m/45:0;$('#joy').firstElementChild.style.transform=`translate(${joy.x*30}px,${joy.y*30}px)`;}
    else if(lookTouch&&t.identifier===lookTouch.id){look(t.clientX-lookTouch.x,t.clientY-lookTouch.y,.005);lookTouch.x=t.clientX;lookTouch.y=t.clientY;}
  }
},{passive:false});
function endTouch(e){for(const t of e.changedTouches){if(t.identifier===joy.id){joy.id=null;joy.x=joy.y=0;$('#joy').hidden=true;}if(lookTouch&&t.identifier===lookTouch.id)lookTouch=null;}}
canvas.addEventListener('touchend',endTouch);canvas.addEventListener('touchcancel',endTouch);

      const f=((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0)-joy.y;
      const s=((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0)+joy.x;

    }

    }

    let LL=S.lights;
    if(S.flash3>0){S.flash3=Math.max(0,S.flash3-dt*.45);const k=Math.sin(S.flash3*PI);LL=LL.slice();LL[3]=[.6,1.4,9.4-(1-S.flash3)*4,1.2*k,1.1*k,.9*k,5.5];}

    if(rainH.visible){for(let i=0;i<RNH;i++){const d=dropsH[i];d.y-=6.5*dt;if(d.y<0){d.y=2.45;d.x=rand(.2,10.8);d.z=rand(.2,9.8);}const j=i*6;rph[j]=d.x;rph[j+1]=d.y;rph[j+2]=d.z;rph[j+3]=d.x;rph[j+4]=d.y+.28;rph[j+5]=d.z;}rgH.attributes.position.needsUpdate=true;}
    if(S.wiperOn){S.w3=(S.w3||0)+dt*1.25*(S.w3d||1);if(S.w3>=1){S.w3=1;S.w3d=-1;SFX.wiper();}if(S.w3<=0){S.w3=0;S.w3d=1;SFX.wiper();}for(const w of w3)w.rotation.z=smooth(S.w3)*1.55;}
    if(S.step==='phone'&&houseAu){S.ringT=(S.ringT||0)-dt;if(S.ringT<=0){S.ringT=3;SFX.ring(houseAu.phoneIn);}}
    setLights(S.lampOff?[]:LL,S.lampOff?[.004,.004,.006]:S.amb,S.fog,S.near,S.far);
    // interaction
    S.cur=null;let lbl='';
    if(S.special&&!examining){S.cur=S.special;lbl=S.special.label;}
    else if(!S.busy&&!examining&&controls.look){
      scene.updateMatrixWorld();figScene.updateMatrixWorld();ray.setFromCamera(center,camera);ray.far=3;
      const lab=o=>o?(typeof o.label==='function'?o.label():o.label):null;
      const hit=ray.intersectObjects(blockers.concat(targets),true).find(h=>shown(h.object)&&!(h.object.userData.alwaysHit&&!lab(h.object.userData.inter)));
      if(hit){const o=hit.object.userData.inter;if(o&&hit.distance<=o.dist){const l2=typeof o.label==='function'?o.label():o.label;if(l2){S.cur=o;lbl=l2;}}}
    }
    setPrompt(lbl);
    // props
    flick-=dt;if(flick<0){flick=rand(5,9);}
    const tex317=flick<(S.day===2?.35:.14)&&S.phase!=='evening'&&S.step!=='alarm';
    if(S.phase!=='evening')alarmFace.material.uniforms.map.value=(tex317||S.loopMon)?TX.alarm317:TX.alarm700;
    else alarmFace.material.uniforms.map.value=flick<.14?TX.alarm317:TX.alarm1148;
    ledT+=dt;led.material.uniforms.uEmissive.value=S.ledOn?(Math.floor(ledT*1.6)%2?1.2:.15):.1;
    tvT+=dt;if(tvT>.06){tvT=0;updateTV();}
    for(const m of mugs){const u=m.userData;if(u.target){m.position.lerp(u.target,Math.min(1,dt*4));if(m.position.distanceTo(u.target)<.002){m.position.copy(u.target);u.target=null;}}
      if(u.shake>0){u.shake-=dt;m.rotation.z=Math.sin(u.shake*60)*.06*u.shake;}else m.rotation.z=0;}
    for(const s of steam){const m=s.userData.m;s.visible=S.mugsOnTable&&!m.userData.target&&!m.userData.tipped&&!S.noSteam&&S.phase!=='evening';if(!s.visible)continue;
      s.userData.ph=(s.userData.ph+dt*.4)%1;const p=s.userData.ph;s.position.set(m.position.x+Math.sin(p*9+m.userData.i)*.02,m.position.y+m.userData.h/2+.02+p*.28,m.position.z);s.scale.setScalar(1-p*.7);}
    const inDup=S.pos.x>X0-1&&S.pos.x<X0+6;S.figOn=inDup;
    if(inDup){
      figScene.updateMatrixWorld();camera.updateMatrixWorld();camera.getWorldDirection(tmpD);
      const hd=figStand.visible?MT.head:(S.swapped?MS.head:ML.head);hd.getWorldPosition(tmpV2);
      tmpV.copy(tmpV2).sub(camera.position).normalize();S.figInView=(figStand.visible||figSit.visible||figLie.visible)&&tmpV.dot(tmpD)>.72;
      if(figStand.visible){}
      else if(!S.swapped){const a=clamp(Math.atan2(camera.position.x-tmpV2.x,camera.position.y-tmpV2.y),-1.15,1.15);ML.head.rotation.y+=(a-ML.head.rotation.y)*Math.min(1,dt*.7);}
      else{const dx=camera.position.x-tmpV2.x,dz=camera.position.z-tmpV2.z;let rel=Math.atan2(dx,dz)-figSit.rotation.y;rel=Math.atan2(Math.sin(rel),Math.cos(rel));
        MS.head.rotation.y+=(clamp(rel,-1.3,1.3)-MS.head.rotation.y)*Math.min(1,dt*2.5);
        const p=-Math.atan2(camera.position.y-tmpV2.y,Math.hypot(dx,dz))-.1;MS.head.rotation.x+=(clamp(p,-.7,.4)-MS.head.rotation.x)*Math.min(1,dt*2.5);}
      S.twT=(S.twT||2)-dt;const nk=S.swapped?MS.neck:ML.neck;if(S.twT<0){S.twT=rand(1.2,3.8);S.twK=.07;S.twA=(R0()<.5?-1:1)*rand(.12,.3);}
      if(S.twK>0){S.twK-=dt;nk.rotation.z=S.twA;}else nk.rotation.z=0;
      ensureWhine();
      if(!S.cut){const on=S.figInView;AU.master.gain.setTargetAtTime(on?.1:.85,AU.C.currentTime,on?.03:.5);S.whine.gain.setTargetAtTime(on?(S.whineBoost||.018):0,AU.C.currentTime,.04);}
      S.stutter=S.figInView&&!S.cut;
    }else S.stutter=false;
    if(famG.visible&&!S.blinking){camera.updateMatrixWorld();camera.getWorldDirection(tmpD);tmpV.set(5.95,1.0,6.15).sub(camera.position).normalize();const on=tmpV.dot(tmpD)>.82;
      ensureWhine();S.stutter=on;
      if(on){S.famSeen=(S.famSeen||0)+dt;const k=S.famSeen;S.famW.head.rotation.y=Math.min(PI,k*.45);S.famW.neck.scale.y=1+Math.min(1.1,k*.18);S.famC.head.rotation.z=-Math.min(1.5,k*.3);}AU.master.gain.setTargetAtTime(on?.14:.85,AU.C.currentTime,on?.03:.4);S.whine.gain.setTargetAtTime(on?.016:0,AU.C.currentTime,.04);}
    if(S.step==='dup2'&&!S.busy&&!S.ending){
      if(!S.figGone){if(!S.figInView)S.awayT+=dt;else S.awayT=0;if(S.awayT>1.1){S.figGone=true;figLie.visible=false;}}
    }
    if(houseAu){const k=S.breathOn?Math.pow(.5+.5*Math.sin(gameTime*1.3),3):0;houseAu.breathBus.gain.setTargetAtTime(k,AU.C.currentTime,.05);}
    // tv watching
    if(S.watching>0&&!S.muted){S.watching-=dt;fx.stat=Math.min(.16,fx.stat+dt*.05);if(houseAu){houseAu.tv.vol=.2;if(!S.tvBoxOn){S.tvBoxOn=musicBox(houseAu.tvBox,.12,.9);S.tvBoxOn.semis=-2;S.tvBoxOn.wob=.02;ramp(houseAu.tvBox.gain,.5,1);}}}
    else{fx.stat=Math.max(0,fx.stat-dt*.08);if(houseAu){houseAu.tv.vol=S.muted?0:.025;if(S.tvBoxOn){S.tvBoxOn.on=false;S.tvBoxOn=null;ramp(houseAu.tvBox.gain,0,.3);}}}
    if(S.forceStat!=null)fx.stat=S.forceStat;
    if(S.statPunch>0){S.statPunch=Math.max(0,S.statPunch-dt*1.4);fx.stat=Math.max(fx.stat,S.statPunch);}

      houseAu.alarmBus.gain.value=alarmOn?((Math.floor(gameTime*8)%8<4&&Math.floor(gameTime*8)%2===0)?.9:0):0;
      if(AU.C.currentTime>tickNext&&!(S.day===4&&(S.monVol||0)>.02)){tickNext=AU.C.currentTime+1;const t=AU.C.currentTime+.02;const s=AU.C.createBufferSource();s.buffer=AU.noise;const f=F('highpass',2200),g=G(0);
        if(S.day===2){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.6,t+.035);g.gain.setValueAtTime(0,t+.036);}else{g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.6,t+.003);g.gain.exponentialRampToValueAtTime(.001,t+.04);}chain(s,f,g,houseAu.tickBus);s.start(t,Math.random());s.stop(t+.06);}
      [houseAu.fridge,houseAu.tick,houseAu.tv,houseAu.outside,houseAu.alarm,houseAu.closet,houseAu.breath,houseAu.phone,houseAu.kid,houseAu.hum,houseAu.water,S.msgSrc,S.knockSrc].forEach(p=>p&&p.update(cp,S.yaw));}
  };

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);renderer.getDrawingBufferSize(VOIDD.uCanvas.value);const lw=Math.round(LOW_H*w/h);rt.setSize(lw,LOW_H);postMat.uniforms.uRes.value.set(lw,LOW_H);SH.uSnap.value.set(lw,LOW_H);camera.aspect=w/h;camera.updateProjectionMatrix();}

function unlockQuiet(){if(document.exitPointerLock&&locked()){selfUnlock=true;document.exitPointerLock();}}

function setPause(p){
  if(p===paused)return;if(p&&!gameOn())return;
  paused=p;$('#pause').hidden=!p;
  if(p){const late=(HS.day>=4||stage===RD&&RD.d5);$('#pTitle').textContent=late?'ALMOST THERE':'PAUSED';$('#pResume').textContent=late?'KEEP DRIVING':'RESUME';
    if(late){pausedAt=performance.now();unlockQuiet();for(const k in keys)keys[k]=false;joy.x=joy.y=0;paused=true;$('#pause').hidden=false;$('#pMenu').textContent='MAIN MENU';$('#pMenu').dataset.armed='';if(AU.master)AU.master.gain.setTargetAtTime(.18,AU.C.currentTime,.3);return;}
    pausedAt=performance.now();unlockQuiet();for(const k in keys)keys[k]=false;joy.x=joy.y=0;if(AU.C)AU.C.suspend();$('#pMenu').textContent='MAIN MENU';$('#pMenu').dataset.armed='';setTimeout(()=>$('#pResume').focus(),30);}
  else{if(AU.C){AU.C.resume();if(HS.day>=4||stage===RD&&RD.d5)AU.master.gain.setTargetAtTime(.85,AU.C.currentTime,.2);}}
}

function bindRange(id,key,scale){const el=$(id);el.value=Math.round(SET[key]*scale);el.addEventListener('input',()=>{SET[key]=el.value/scale;applySet();saveSet();});}

function frame(now){
  if(paused){last=now;requestAnimationFrame(frame);return;}
  const dt=Math.min(.05,(now-last)/1000);last=now;gameTime+=dt;
  for(let i=timers.length-1;i>=0;i--)if(timers[i].t<=gameTime){const r=timers[i].r;timers.splice(i,1);r();}
  if(fx.fade<fx.fadeT)fx.fade=Math.min(fx.fadeT,fx.fade+fx.fadeRate*dt);else if(fx.fade>fx.fadeT)fx.fade=Math.max(fx.fadeT,fx.fade-fx.fadeRate*dt);
